name: Release

on:
  push:
    tags: ["v*"]
  # Manual start (Actions tab, or Claude via the API): releases the version in config/mod.json from main,
  # creating the tag itself. Used because Claude sessions can't push tags.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Work out the tag
        run: |
          VERSION=$(node -p "require('./config/mod.json').version")
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            echo "TAG=v$VERSION" >> "$GITHUB_ENV"
          elif [ "v$VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match config version v$VERSION"; exit 1
          else
            echo "TAG=$GITHUB_REF_NAME" >> "$GITHUB_ENV"
          fi

      - name: Install
        run: |
          if [ -f package-lock.json ]; then npm ci --no-audit --no-fund; else npm install --no-audit --no-fund; fi

      - name: Check, type-check, build, package
        run: npm run release

      - name: Extract changelog section
        run: |
          VERSION=${TAG#v}
          awk "/^## \\[$VERSION\\]/{flag=1;next}/^## \\[/{flag=0}flag" CHANGELOG.md > release-notes.md
          [ -s release-notes.md ] || echo "Release $TAG" > release-notes.md

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$TAG" dist/*.mcaddon --title "$TAG" --notes-file release-notes.md --target "$GITHUB_SHA"
